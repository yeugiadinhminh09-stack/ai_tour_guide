<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Tour Guide</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.L||document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>

<style>
body{background:#F6F5F0;color:#17353a;font-family:'Segoe UI',system-ui,sans-serif}
.card{background:#fbfaf6;border-radius:1.5rem;box-shadow:0 12px 32px -14px rgba(27,94,99,.3)}
.hero{background-image:linear-gradient(180deg,rgba(7,38,43,.82) 0%,rgba(7,38,43,.2) 28%,rgba(7,38,43,.4) 55%,rgba(7,38,43,.92) 100%),url('assets/hinh_22.jpg');background-size:cover;background-position:center;background-color:#1B5E63}
.glass{background:rgba(7,38,43,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2)}
.tag{padding:.4rem .9rem;border-radius:999px;background:#fbfaf6;box-shadow:0 4px 12px -6px rgba(27,94,99,.4);font-size:.85rem;white-space:nowrap}
.tag.on{background:#1B5E63;color:#fff}
.btn{background:#1B5E63;color:#fff;border-radius:999px;padding:.55rem 1.1rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{background:#154a4e}
.btn.alt{background:#e4efee;color:#1B5E63}
.menu-btn{width:100%;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.8rem .2rem;border-radius:1.2rem;font-size:.68rem;text-align:center;color:#1B5E63}
.menu-btn:hover,.menu-btn.on{background:#1B5E63;color:#fff}
.bubble{max-width:88%;padding:.7rem 1rem;border-radius:1.2rem;font-size:.92rem;line-height:1.5;white-space:pre-wrap}
.bot{background:rgba(255,255,255,.94);color:#17353a;border-bottom-left-radius:.3rem}
.me{background:#1B5E63;color:#fff;margin-left:auto;border-bottom-right-radius:.3rem}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:.4rem .85rem;font-size:.8rem}
.chip:hover{background:rgba(255,255,255,.3)}
#chat::-webkit-scrollbar,.hs::-webkit-scrollbar{height:0;width:4px}
#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:4px}
.thumb{background:#cfe3e1;object-fit:cover}
#map{height:260px;border-radius:1.2rem;z-index:1}
.leaflet-container{font-family:inherit}
:focus-visible{outline:3px solid #1B5E63;outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}}
.fa-solid{display:inline-block;text-align:center;line-height:1}
</style>
</head>
<body class="pb-28 lg:pb-8">

<div class="max-w-[1500px] mx-auto px-3 sm:px-6 pt-4">

  <header class="flex items-center justify-between gap-3 mb-4">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-11 h-11 shrink-0 rounded-2xl bg-[#1B5E63] text-white flex items-center justify-center"><i data-lucide="waves"></i></div>
      <div class="min-w-0">
        <h1 class="text-xl sm:text-2xl font-bold leading-tight">AI Tour Guide</h1>
        <p class="text-xs sm:text-sm text-[#1B5E63]/80 truncate" data-i18n="sub"></p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button id="langBtn" class="tag font-semibold" aria-label="Language">VI</button>
      <button class="tag lg:hidden" onclick="openBadges()" aria-label="Badges"><i data-lucide="trophy" class="w-4 h-4"></i></button>
      <button class="tag" onclick="openGuide()" aria-label="Guide"><i data-lucide="bell" class="w-4 h-4"></i></button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

    <aside class="hidden lg:flex lg:col-span-1 card flex-col gap-2 p-2 self-start sticky top-4">
      <button class="menu-btn on" onclick="goHome()"><i data-lucide="home"></i><span data-i18n="home"></span></button>
      <button class="menu-btn" onclick="goMap()"><i data-lucide="map"></i><span data-i18n="sov"></span></button>
      <button class="menu-btn" onclick="openOffline()"><i data-lucide="calendar-check"></i><span data-i18n="off"></span></button>
      <button class="menu-btn" onclick="openBadges()"><i data-lucide="award"></i><span data-i18n="badge"></span></button>
      <button class="menu-btn" onclick="openSupport()"><i data-lucide="headset"></i><span data-i18n="sup"></span></button>
    </aside>

    <section id="aiFrame" class="lg:col-span-7 hero rounded-3xl overflow-hidden relative flex flex-col h-[640px] shadow-xl text-white">
      <div class="px-5 pt-5 pr-24">
        <h2 class="text-3xl sm:text-4xl font-bold tracking-tight drop-shadow">AI Tour Guide</h2>
        <p class="text-sm text-white/90 mt-1 drop-shadow" data-i18n="assistant"></p>
      </div>
      <button onclick="openQuiz()" class="absolute top-4 right-4 flex flex-col items-center" aria-label="Chú Cừu Tư Vấn">
        <span class="w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center text-3xl border-4 border-[#1B5E63]">🐑</span>
        <span class="text-[11px] mt-1 glass rounded-full px-2" data-i18n="sheep"></span>
      </button>
      <div class="flex-1"></div>
      <div class="p-3 sm:p-4 flex flex-col gap-3 min-h-0 max-h-[68%]">
        <div id="chat" class="glass rounded-2xl p-3 flex flex-col gap-2 overflow-y-auto flex-1"></div>
        <div class="flex gap-2 overflow-x-auto hs" id="quick"></div>
        <div class="flex gap-2">
          <input id="msg" class="flex-1 rounded-full px-4 py-3 bg-white/95 text-[#17353a] placeholder-[#17353a]/60 outline-none" data-ph="ph">
          <button id="send" class="btn !px-4" aria-label="Send"><i data-lucide="send" class="w-5 h-5"></i></button>
        </div>
      </div>
    </section>

    <div class="lg:col-span-4 flex flex-col gap-4">
      <div class="rounded-3xl p-5 text-white shadow-lg" style="background:linear-gradient(135deg,#1B5E63,#2c8087)">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold flex items-center gap-2"><i data-lucide="cloud-sun"></i><span data-i18n="wT"></span></h3>
          <div class="flex gap-1 bg-white/15 rounded-full p-1 text-sm">
            <button id="wKH" class="px-3 py-1 rounded-full" onclick="loadWeather('KH')">Khánh Hòa</button>
            <button id="wNT" class="px-3 py-1 rounded-full" onclick="loadWeather('NT')">Ninh Thuận</button>
          </div>
        </div>
        <div id="wNow" class="flex items-center gap-3 text-5xl font-light">--</div>
        <div id="wHours" class="grid grid-cols-4 gap-2 mt-4 text-center text-sm"></div>
      </div>

      <div id="mapCard" class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold flex items-center gap-2"><i data-lucide="map-pin"></i><span data-i18n="mT"></span></h3>
        </div>
        <div id="map"></div>
        <p class="text-xs text-[#17353a]/70 mt-2" data-i18n="mNote"></p>
      </div>

      <div class="card p-4">
        <h3 class="font-semibold flex items-center gap-2 mb-3"><i data-lucide="route"></i><span data-i18n="iT"></span></h3>
        <div id="itin"></div>
      </div>
    </div>

    <section id="explore" class="lg:col-span-12 mt-2">
      <h2 class="text-xl sm:text-2xl font-bold mb-3" data-i18n="exT"></h2>
      <div class="flex flex-col md:flex-row gap-3 mb-4">
        <div class="relative md:w-80">
          <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[#1B5E63]"></i>
          <input id="q" class="w-full rounded-full pl-10 pr-4 py-2.5 bg-[#fbfaf6] shadow outline-none" data-ph="search">
        </div>
        <div id="tags" class="flex gap-2 overflow-x-auto md:flex-wrap hs pb-1"></div>
      </div>
      <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4"></div>
      <p id="none" class="hidden text-center py-10 text-[#17353a]/70" data-i18n="none"></p>
    </section>
  </div>
</div>

<nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-[#fbfaf6] border-t border-[#1B5E63]/10 rounded-t-3xl shadow-[0_-8px_24px_-12px_rgba(27,94,99,.4)]">
  <div class="grid grid-cols-5 items-end px-2 pb-2 pt-1 text-[11px] text-[#1B5E63]">
    <button class="flex flex-col items-center gap-0.5 py-2" onclick="goHome()"><i data-lucide="home"></i><span data-i18n="home"></span></button>
    <button class="flex flex-col items-center gap-0.5 py-2" onclick="goMap()"><i data-lucide="map"></i><span data-i18n="mapShort"></span></button>
    <button class="flex justify-center" onclick="goAI()" aria-label="AI Tour Guide"><span class="-mt-8 w-16 h-16 rounded-full bg-[#1B5E63] text-white flex items-center justify-center shadow-xl border-4 border-[#F6F5F0]"><i data-lucide="sparkles" class="w-7 h-7"></i></span></button>
    <button class="flex flex-col items-center gap-0.5 py-2" onclick="openOffline()"><i data-lucide="calendar-check"></i><span data-i18n="offShort"></span></button>
    <button class="flex flex-col items-center gap-0.5 py-2" onclick="openSupport()"><i data-lucide="headset"></i><span data-i18n="sup"></span></button>
  </div>
</nav>

<div id="modal" class="hidden fixed inset-0 z-50 bg-[#07262b]/70 backdrop-blur-sm items-center justify-center p-3" onclick="if(event.target===this)closeModal()">
  <div class="pop card w-full max-w-lg max-h-[90vh] overflow-y-auto relative" id="modalBody"></div>
</div>

<script>
const k1 ="AQ.Ab8RN6LUZqG7EmGq";
const k2 ="YE4gU3dfgJ3TLp6w4virJ2dqdPVMSghsog";
const k3 ="AQ.Ab8RN6Kk43FDvTxcz";
const k4 ="KF1L8mC-uXwUBaFDMSBuH6QnnvG_i-bqw";
const k5 ="AQ.Ab8RN6JDHh3iABrSocv";
const k6 ="f57lTvpum_Bf83OB129lkYZOU2f9D0Q";

const GEMINI_API_KEY = k1 + k2;
const GEMINI_API_KEY_2 = k3 + k4;
const GEMINI_API_KEY_3 = k5 + k6;

const GEMINI_MODEL = "gemini-3.5-flash";

const R = (id, name, tags, price, lat, lng, desc, priceText) => ({id: id, name: name, area: "", tags: tags, price: price, priceText: priceText || "", lat: lat, lng: lng, desc: desc});
const DESTINATIONS = [
  R(1,"Bãi Biển Trần Phú",["Tắm biển","Check-in","Ngắm bình minh","Gia đình","Miễn phí"],0,12.2430,109.1975,"📍 Giới thiệu: Bãi biển trung tâm dài khoảng 6 km chạy dọc đại lộ Trần Phú, cát mịn, nước trong và sóng êm. Đây là nơi tắm biển, đi dạo, chơi thể thao nước và thưởng thức hải sản ngay sát trung tâm thành phố.\n💡 Mẹo hướng dẫn viên: Đến lúc 5h–6h sáng để ngắm bình minh mát và vắng, tắm biển trước 9h hoặc sau 16h để tránh nắng gắt. Mang theo đồ thay, mũ nón, và chụp ảnh đẹp nhất khi nắng còn nhẹ.","Miễn phí (gửi xe 5.000đ - 10.000đ)"),
  R(2,"Tháp Bà Ponagar",["Tâm linh","Văn hóa Chăm","Check-in","Khám phá","Gia đình"],30000,12.2655,109.1953,"📍 Giới thiệu: Quần thể đền tháp Chăm cổ từ thế kỷ VIII, thờ nữ thần Thiên Y A Na, nhìn xuống cửa sông Cái. Các tháp gạch nung đỏ còn khá nguyên vẹn, thường có biểu diễn nhạc và múa Chăm ngay tại sân tháp.\n💡 Mẹo hướng dẫn viên: Nên đi sáng sớm hoặc chiều muộn để tránh nắng và đông khách. Mặc trang phục kín đáo (quá gối, che vai) và cởi giày khi vào tháp; góc chụp đẹp nhất là từ sân tháp nhìn xuống dòng sông.","30.000đ"),
  R(3,"Chùa Long Sơn",["Tâm linh","Check-in","Ngắm hoàng hôn","Khám phá","Miễn phí"],0,12.2500,109.1817,"📍 Giới thiệu: Ngôi chùa lâu đời nổi tiếng với tượng Phật Thích Ca trắng cao khoảng 24 m trên đỉnh núi Trại Thủy. Leo gần 200 bậc thang sẽ được ngắm toàn cảnh thành phố và biển từ trên cao.\n💡 Mẹo hướng dẫn viên: Lên vào sáng sớm hoặc chiều mát để tránh nắng, mang nước uống. Mặc trang phục kín đáo, giữ yên lặng và nên lên đỉnh lúc chiều để ngắm hoàng hôn.","Miễn phí (gửi xe 5.000đ - 10.000đ)"),
  R(4,"VinWonders Nha Trang",["Vui chơi","Gia đình","Nghỉ dưỡng","Check-in","Khám phá"],875000,12.2186,109.2345,"📍 Giới thiệu: Công viên giải trí trên đảo Hòn Tre với tàu lượn, công viên nước, thủy cung và các show diễn buổi tối. Có thể đi bằng cáp treo vượt biển hoặc cano để vào đảo.\n💡 Mẹo hướng dẫn viên: Nên đến ngay giờ mở cửa và mua vé trước để tránh xếp hàng. Mang đồ bơi, kem chống nắng, giày dép thoải mái và dành cả ngày để chơi, giữ sức xem show tối.","800.000đ - 950.000đ"),
  R(5,"Nhà Thờ Đá Nha Trang",["Tâm linh","Văn hóa","Check-in","Khám phá","Miễn phí"],0,12.2492,109.1923,"📍 Giới thiệu: Nhà thờ Chánh tòa Núi xây bằng đá theo kiến trúc Gothic trên đồi cao giữa trung tâm. Màu đá xám cổ kính và các cửa kính màu tạo nên không gian trang nghiêm, là biểu tượng quen thuộc của thành phố.\n💡 Mẹo hướng dẫn viên: Nên tham quan ngoài giờ lễ, mặc trang phục lịch sự và giữ yên lặng. Sáng sớm hoặc chiều muộn ánh sáng đẹp nhất để chụp ảnh toàn cảnh từ sân nhà thờ.","Miễn phí"),
  R(6,"Chợ Đầm",["Ẩm thực","Văn hóa","Check-in","Gia đình","Miễn phí"],0,12.2537,109.1913,"📍 Giới thiệu: Khu chợ lâu đời với mái tròn đặc trưng, bán hải sản khô, đặc sản, đồ lưu niệm và nhiều món ăn vặt như nem nướng, bún sứa. Đây là nơi cảm nhận nhịp sống và ẩm thực của người dân địa phương.\n💡 Mẹo hướng dẫn viên: Đi sáng sớm để mua đồ tươi và đỡ nóng. Hỏi giá trước khi mua, trả giá nhẹ nhàng và giữ kỹ túi xách, điện thoại ở nơi đông người.","Miễn phí vào chợ (chi phí ăn uống, mua sắm tùy nhu cầu)"),
  R(7,"Viện Hải Dương Học",["Khám phá","Văn hóa","Gia đình","Check-in"],40000,12.2064,109.2144,"📍 Giới thiệu: Viện nghiên cứu biển lâu đời nhất Việt Nam với bảo tàng hàng nghìn mẫu vật sinh vật biển và các hồ cá sống. Du khách có thể tìm hiểu hệ sinh thái biển, san hô và nhiều loài cá đặc trưng vùng biển.\n💡 Mẹo hướng dẫn viên: Đi vào buổi sáng sớm để đỡ đông và mát hơn. Dành khoảng 1,5–2 giờ tham quan, mang theo nước uống và nên đi cùng trẻ nhỏ để các em học hỏi.","40.000đ"),
  R(8,"Hòn Chồng",["Check-in","Khám phá","Ngắm bình minh","Gia đình"],30000,12.2711,109.2064,"📍 Giới thiệu: Cụm đá granit khổng lồ xếp chồng lên nhau ven biển, có dấu bàn tay lớn gắn với truyền thuyết người khổng lồ. Gió biển mát, tầm nhìn rộng, thường có biểu diễn nhạc dân tộc cho du khách.\n💡 Mẹo hướng dẫn viên: Đến sáng sớm để ngắm bình minh và tránh đông. Mang giày dễ đi vì có nhiều bậc đá, đội mũ nón khi trời nắng và chụp ảnh với khối đá chồng từ phía bờ biển.","30.000đ"),
  R(9,"Đảo Khỉ",["Khám phá","Gia đình","Vui chơi","Dã ngoại"],210000,12.3342,109.2800,"📍 Giới thiệu: Đảo có đàn khỉ sống tự nhiên cùng chương trình xiếc thú, biểu diễn vui nhộn dành cho trẻ em. Đây là điểm đến thú vị cho gia đình muốn tìm hiểu động vật và đi tàu ngắm cảnh biển.\n💡 Mẹo hướng dẫn viên: Giữ chặt điện thoại, kính và túi xách vì khỉ có thể giật đồ. Không trêu chọc hay cho khỉ ăn tùy tiện, mang mũ và kem chống nắng, nên đi buổi sáng cho mát.","180.000đ - 240.000đ (gồm tàu khứ hồi)"),
  R(10,"Đảo Hoa Lan",["Tắm biển","Check-in","Gia đình","Khám phá","Dã ngoại"],210000,12.3100,109.2900,"📍 Giới thiệu: Đảo nhỏ trong vịnh với bãi tắm yên tĩnh, vườn hoa và nhiều góc ảnh xanh mát. Không gian thoáng đãng, phù hợp cho gia đình và nhóm bạn muốn nghỉ nhẹ nhàng, không quá đông.\n💡 Mẹo hướng dẫn viên: Đi vào buổi sáng để biển êm và nắng dịu. Mang đồ bơi, kem chống nắng, đồ thay và nên hỏi rõ lịch tàu về trước khi lên đảo.","180.000đ - 240.000đ (gồm tàu khứ hồi)"),
  R(11,"Bãi Biển Đại Lãnh",["Tắm biển","Check-in","Ngắm bình minh","Dã ngoại","Miễn phí"],0,12.8167,109.4333,"📍 Giới thiệu: Bãi biển cát trắng dài ở vùng bắc Khánh Hòa, nước trong, thoáng và ít khách hơn Nha Trang. Gần khu vực điểm cực đông đất liền Việt Nam nên rất hợp để kết hợp ngắm bình minh.\n💡 Mẹo hướng dẫn viên: Đến khoảng 5h sáng để đón bình minh sớm, mang mũ và kem chống nắng vì ít bóng râm. Chuẩn bị sẵn đồ ăn nhẹ và nước uống vì dịch vụ còn ít.","Miễn phí (gửi xe nếu có)"),
  R(12,"Mũi Đôi",["Check-in","Khám phá","Ngắm bình minh","Dã ngoại","Miễn phí"],0,12.8800,109.4600,"📍 Giới thiệu: Mũi đất nhô ra biển với vách đá, sóng và gió lớn, nổi tiếng với cảnh đón bình minh sớm nhất cả nước. Cảnh biển trời rộng mở và hoang sơ, rất hợp cho người thích khám phá.\n💡 Mẹo hướng dẫn viên: Đến khoảng 4h30–5h để kịp đón ánh bình minh, mang đèn pin và giày bám tốt. Gió mạnh nên cẩn thận khi đi trên đá, theo dõi thời tiết và đi theo nhóm.","Miễn phí (tham quan tự do)"),
  R(13,"Đảo Điệp Sơn",["Check-in","Tắm biển","Khám phá","Dã ngoại"],400000,12.6100,109.3600,"📍 Giới thiệu: Nổi tiếng với con đường cát đi giữa biển lộ ra khi thủy triều xuống, tạo nên cảnh tượng độc đáo. Du khách có thể đi bộ, chụp ảnh, tắm biển và ngắm san hô gần bờ.\n💡 Mẹo hướng dẫn viên: Xem lịch thủy triều và chọn thời điểm nước rút để đi con đường giữa biển. Nên đi buổi sáng, mang dép chống trượt, mũ nón và đồ thay.","250.000đ - 550.000đ (tùy tour cano/tàu)"),
  R(14,"Đảo Bình Ba",["Tắm biển","Ẩm thực","Khám phá","Gia đình","Dã ngoại"],400000,11.8400,109.2300,"📍 Giới thiệu: Hòn đảo ở vịnh Cam Ranh được gọi là đảo tôm hùm, nước biển trong và còn nhiều làng chài. Du khách có thể tắm biển, ngắm san hô, đi cano và thưởng thức hải sản tươi tại chỗ.\n💡 Mẹo hướng dẫn viên: Đi tour trong ngày và xuất phát sớm để có nhiều thời gian trên đảo. Hỏi giá và cân hải sản trước khi gọi món, mang áo phao nếu đi cano.","250.000đ - 550.000đ (tùy tour cano/tàu)"),
  R(15,"Đảo Bình Hưng",["Tắm biển","Dã ngoại","Check-in","Nghỉ dưỡng","Khám phá"],400000,11.8800,109.2600,"📍 Giới thiệu: Đảo yên tĩnh với bãi cát trắng, nước trong và ít khách, thích hợp nghỉ dưỡng, cắm trại và chụp ảnh biển hoang sơ. Không khí thanh bình, rất hợp cho người muốn tránh ồn ào.\n💡 Mẹo hướng dẫn viên: Mang đủ đồ ăn nước uống vì dịch vụ ít, đội mũ và thoa kem chống nắng. Đi buổi sáng để biển êm, hỏi rõ giờ tàu về trước khi lên đảo.","250.000đ - 550.000đ (tùy tour cano/tàu)"),
  R(16,"Bãi Dài",["Tắm biển","Nghỉ dưỡng","Check-in","Ngắm hoàng hôn","Gia đình","Miễn phí"],0,11.9780,109.2310,"📍 Giới thiệu: Bãi biển dài hơn 10 km ở khu vực Cam Ranh, cát trắng, sóng nhẹ, gần sân bay và nhiều resort. Không gian rộng, yên tĩnh, rất hợp cho nghỉ dưỡng gia đình và đi dạo bờ biển.\n💡 Mẹo hướng dẫn viên: Đến chiều muộn để đón hoàng hôn và tránh nắng gắt. Ít bóng râm nên mang mũ, ô và kem chống nắng; chọn khu vực gần resort nếu cần nhà vệ sinh, quán nước.","Miễn phí (gửi xe nếu có)"),
  R(17,"Khu Du Lịch Tàu Ngầm",["Khám phá","Gia đình","Vui chơi","Check-in"],70000,12.1900,109.2200,"📍 Giới thiệu: Trải nghiệm tàu ngầm quan sát đáy biển qua cửa kính, ngắm san hô và đàn cá đủ màu mà không cần lặn. Rất phù hợp cho gia đình và người ngại xuống nước.\n💡 Mẹo hướng dẫn viên: Nên đặt chỗ trước và hỏi lịch chạy tàu vì phụ thuộc vào thời tiết và biển. Đi sáng cho nước trong hơn, mang theo kem chống nắng nếu đi cùng tour đảo.","70.000đ"),
  R(18,"Suối Khoáng Nóng Tháp Bà",["Thư giãn","Nghỉ dưỡng","Gia đình","Khám phá"],235000,12.2685,109.1967,"📍 Giới thiệu: Khu tắm bùn khoáng nóng và hồ bơi khoáng giúp thư giãn, thích hợp sau những ngày di chuyển dài. Có nhiều gói từ ngâm khoáng đến tắm bùn, phù hợp cho gia đình và nhóm bạn.\n💡 Mẹo hướng dẫn viên: Nên đi buổi sáng hoặc chiều mát, mang đồ bơi và khăn riêng. Hỏi rõ nội dung từng gói trước khi mua và không nên ngâm quá lâu một lần.","120.000đ - 350.000đ (tùy gói tắm khoáng/bùn)"),
  R(19,"Thác Yang Bay",["Khám phá","Sinh thái","Gia đình","Vui chơi","Dã ngoại"],150000,12.1300,109.0200,"📍 Giới thiệu: Khu du lịch sinh thái với thác, suối khoáng, vườn thú nhỏ và các màn biểu diễn văn hóa. Không khí mát mẻ giữa núi rừng, phù hợp đi cùng gia đình hoặc nhóm bạn.\n💡 Mẹo hướng dẫn viên: Mang đồ thay và giày chống trượt, đi vào buổi sáng để mát và đỡ đông. Mùa mưa thác nhiều nước, nên theo dõi thời tiết và nghe theo hướng dẫn an toàn.","150.000đ"),
  R(20,"Đỉnh Hòn Bà",["Khám phá","Sinh thái","Dã ngoại","Check-in","Nghỉ dưỡng"],0,12.1170,108.9670,"📍 Giới thiệu: Khu rừng núi cao với khí hậu mát lạnh quanh năm, thỉnh thoảng có biển mây phủ kín. Đây là nơi bác sĩ Yersin từng nghiên cứu, có thể đi bộ rừng và ngắm cảnh núi non.\n💡 Mẹo hướng dẫn viên: Mang áo ấm vì buổi sáng và chiều tối khá lạnh, đi sáng sớm để có cơ hội săn biển mây. Đường đi dốc, nên mang giày bám tốt và đi vào ngày thời tiết đẹp.","Chưa xác nhận - kiểm tra giá vé tại cổng khu bảo tồn"),
  R(21,"Thành Cổ Diên Khánh",["Văn hóa","Khám phá","Check-in","Gia đình","Miễn phí"],0,12.2561,109.0148,"📍 Giới thiệu: Tòa thành cổ xây năm 1793, từng là tỉnh lỵ của Khánh Hòa với các cổng thành, tường thành và nhà cổ còn lưu lại. Phù hợp cho người yêu lịch sử muốn tìm hiểu một góc Khánh Hòa xưa.\n💡 Mẹo hướng dẫn viên: Đi vào buổi chiều mát và dạo quanh bằng xe đạp hoặc xe máy để ngắm các cổng thành. Mặc trang phục thoáng, mang mũ và hỏi người dân địa phương để biết thêm chuyện xưa.","Miễn phí"),
  R(22,"Đầm Nha Phu",["Khám phá","Ẩm thực","Dã ngoại","Ngắm hoàng hôn","Gia đình"],0,12.3700,109.2700,"📍 Giới thiệu: Vịnh kín gió phía bắc Nha Trang với làng chài, bè nuôi hải sản và cảnh sông nước yên bình. Hợp để đi thuyền ngắm đầm, tìm hiểu nghề nuôi hải sản và thưởng thức đồ biển tươi.\n💡 Mẹo hướng dẫn viên: Đi vào chiều muộn để ngắm hoàng hôn trên mặt nước. Hỏi giá hải sản trước khi gọi món, mang kem chống nắng và đồ chống muỗi nếu ở lại đến tối.","Miễn phí tham quan (tour thuyền, ăn uống tính riêng)"),
  R(23,"Bãi Biển Dốc Lết",["Tắm biển","Check-in","Ẩm thực","Gia đình","Ngắm hoàng hôn"],0,12.4100,109.2250,"📍 Giới thiệu: Bãi cát trắng mịn, nước nông và thoai thoải, rất hợp cho gia đình có trẻ nhỏ. Có nhiều quán hải sản và dịch vụ tắm bùn, là điểm nghỉ dưỡng được nhiều du khách yêu thích.\n💡 Mẹo hướng dẫn viên: Đến chiều muộn để tránh nắng và ngắm hoàng hôn trên biển. Mang kem chống nắng, đồ thay và hỏi giá hải sản trước khi gọi món.","Chưa xác nhận - nên hỏi tại cổng khu du lịch (có thể có phí vào cổng và gửi xe)"),
  R(24,"Khu Du Lịch Sinh Thái Ba Hồ",["Sinh thái","Dã ngoại","Khám phá","Gia đình","Check-in"],100000,12.3350,109.0200,"📍 Giới thiệu: Dòng suối chảy qua ba hồ nước tự nhiên giữa núi rừng, nước mát trong và bờ đá. Du khách có thể tắm suối, dã ngoại, đi bộ và hòa mình vào thiên nhiên.\n💡 Mẹo hướng dẫn viên: Mang giày chống trượt và đồ thay, đi vào buổi sáng khi trời nắng đẹp. Tránh đi khi trời mưa lớn vì nước suối có thể dâng nhanh.","100.000đ"),
  R(25,"Am Chúa",["Tâm linh","Khám phá","Thư giãn","Miễn phí"],0,12.4000,109.1700,"📍 Giới thiệu: Địa điểm tâm linh ở vùng núi, không gian yên tĩnh, thích hợp cho người muốn tìm sự thanh tịnh. Du khách đến thắp hương, nghỉ chân và tìm hiểu tín ngưỡng của người dân địa phương.\n💡 Mẹo hướng dẫn viên: Nên đi vào buổi sáng, ăn mặc kín đáo và giữ trật tự. Hỏi người địa phương để biết đường đi và giờ mở cửa trước khi đến.","Miễn phí"),
  R(26,"Chùa Từ Vân (Chùa Ốc)",["Tâm linh","Check-in","Khám phá","Miễn phí"],0,12.2300,109.1900,"📍 Giới thiệu: Ngôi chùa có công trình độc đáo trang trí bằng vỏ ốc và sò, tạo nên không gian rất riêng. Đây là điểm viếng chùa và chụp ảnh được nhiều du khách tìm đến.\n💡 Mẹo hướng dẫn viên: Giữ trang phục lịch sự và yên lặng khi vào chùa. Đi vào buổi sáng hoặc chiều mát để ánh sáng đẹp và dễ chụp ảnh.","Miễn phí"),
  R(27,"Bãi Biển Ninh Chữ",["Tắm biển","Ẩm thực","Check-in","Ngắm hoàng hôn","Gia đình","Miễn phí"],0,11.5600,109.0100,"📍 Giới thiệu: Bãi biển cong hình lưỡi liềm với cát trắng, nước trong và sóng nhẹ, là bãi tắm nổi tiếng nhất vùng. Gần nhiều quán hải sản và đặc sản thịt cừu, rất hợp để tắm biển, đi dạo và ngắm hoàng hôn.\n💡 Mẹo hướng dẫn viên: Đi chiều muộn để tránh nắng gắt và ngắm hoàng hôn. Thử các món cừu và hải sản địa phương, nhớ hỏi giá trước khi gọi món.","Miễn phí (gửi xe nếu có)"),
  R(28,"Vịnh Vĩnh Hy",["Tắm biển","Khám phá","Dã ngoại","Check-in","Nghỉ dưỡng"],400000,11.7190,109.2000,"📍 Giới thiệu: Vịnh nước xanh ngọc nằm giữa núi và biển, một trong những vịnh đẹp nhất miền Trung. Có thể đi cano, lặn ngắm san hô và đi cung đường ven biển ngắm cảnh.\n💡 Mẹo hướng dẫn viên: Đi vào sáng sớm khi biển lặng và nắng dịu, nên theo dõi gió và thời tiết. Mang kem chống nắng, đồ bơi và chọn tour uy tín.","250.000đ - 550.000đ (tùy tour cano/tàu)"),
  R(29,"Hang Rái",["Check-in","Dã ngoại","Khám phá","Ngắm bình minh"],0,11.7100,109.1800,"📍 Giới thiệu: Bãi đá tự nhiên nằm sát biển với những hồ nước trong vắt, đá nhấp nhô và nhiều góc chụp ảnh. Cảnh quan hoang sơ, hợp cho người thích khám phá và chụp ảnh thiên nhiên.\n💡 Mẹo hướng dẫn viên: Đến sáng sớm hoặc chiều muộn để tránh nắng gắt. Mang giày chống trượt và nước uống, không leo lên đá trơn và đi theo nhóm.","Chưa xác nhận - hỏi tại điểm (có thể có phí gửi xe/vào cổng)"),
  R(30,"Trùng Sơn Cổ Tự",["Tâm linh","Thư giãn","Check-in","Khám phá","Miễn phí"],0,11.6000,108.9800,"📍 Giới thiệu: Ngôi chùa cổ có không gian thanh tịnh trên núi Đá Chồng, thích hợp cho chuyến viếng chùa và tìm sự an yên. Từ sân chùa có thể phóng tầm mắt ngắm trọn cảnh biển Ninh Chữ thơ mộng.\n💡 Mẹo hướng dẫn viên: Nên đi buổi sáng sớm hoặc chiều mát, mặc trang phục kín đáo và giữ yên lặng. Bậc thang đá khá dốc nên hãy đi giày đế bệt cho thoải mái.","Miễn phí"),
  R(31,"Tháp Po Klong Garai",["Văn hóa Chăm","Tâm linh","Check-in"],20000,11.5920,108.9530,"📍 Giới thiệu: Cụm tháp Chăm cổ kính xây bằng gạch nung đỏ sẫm trên đồi Trầu, thờ vua Po Klong Garai với kiến trúc điêu khắc tinh xảo bậc nhất còn sót lại. Nơi đây thường diễn ra các hoạt động biểu diễn văn hóa và lễ hội Katê đặc sắc của đồng bào Chăm.\n💡 Mẹo hướng dẫn viên: Nên đi vào khung giờ 7h30–9h30 sáng hoặc sau 15h30 chiều để tránh nắng gắt và lên ảnh gạch đỏ đẹp nhất. Có dịch vụ thuê trang phục truyền thống Chăm ngay cổng để chụp hình.","20.000đ / người lớn (Trẻ em 10.000đ)"),
  R(32,"Làng Gốm Cổ Chăm Bàu Trúc",["Văn hóa Chăm","Khám phá","Miễn phí"],0,11.5380,108.9540,"📍 Giới thiệu: Một trong những làng gốm cổ nhất Đông Nam Á còn giữ kỹ thuật làm gốm hoàn toàn bằng tay, không dùng bàn xoay và nung lộ thiên bằng rơm củi. Du khách được tận mắt xem nghệ nhân đi giật lùi tạo hình gốm và tự tay trải nghiệm nặn gốm.\n💡 Mẹo hướng dẫn viên: Tham quan làng nghề hoàn toàn miễn phí, nếu tự tay nặn gốm mang về làm quà sẽ có phụ phí nhỏ khoảng 30.000đ–50.000đ. Nên mua trực tiếp tại các hợp tác xã hoặc nhà nghệ nhân để có giá gốc.","Miễn phí tham quan (Sản phẩm từ 30.000đ)"),
  R(33,"Làng Dệt Thổ Cẩm Mỹ Nghiệp",["Văn hóa Chăm","Khám phá","Miễn phí"],0,11.5000,108.9700,"📍 Giới thiệu: Làng nghề dệt thổ cẩm Chăm truyền thống nổi tiếng với những khung cửi thủ công dệt nên các hoa văn rực rỡ mang đậm bản sắc văn hóa bản địa. Du khách có thể tìm hiểu quy trình nhuộm sợi tự nhiên và chọn mua khăn choàng, túi xách, váy áo thủ công.\n💡 Mẹo hướng dẫn viên: Nằm ngay gần làng gốm Bàu Trúc nên rất tiện kết hợp đi chung một buổi. Các sản phẩm dệt tay rất bền đẹp, bạn có thể nhờ nghệ nhân giới thiệu ý nghĩa từng hoa văn trước khi mua.","Miễn phí tham quan (Quà lưu niệm từ 50.000đ)"),
  R(34,"Đồng Cừu An Hòa",["Check-in","Dã ngoại","Nông trại","Ngắm hoàng hôn"],0,11.6200,109.0200,"📍 Giới thiệu: Thảo nguyên cỏ khô rộng lớn đặc trưng của vùng đất nắng gió với những đàn cừu hàng trăm con thả rông tự nhiên quanh hồ nước. Khung cảnh yên bình mang lại cảm giác như đang lạc giữa vùng du mục hoang sơ.\n💡 Mẹo hướng dẫn viên: Thời điểm đẹp nhất để săn ảnh là 6h30–8h00 sáng khi cừu vừa ra chuồng hoặc 16h00–17h30 chiều lúc cừu lùa về chuồng dưới ánh hoàng hôn. Nên gửi người chăn cừu chút tiền nước (khoảng 20.000đ–50.000đ/nhóm) để họ hỗ trợ lùa đàn cừu lại gần chụp ảnh.","Miễn phí (Phí hỗ trợ chụp ảnh 20.000đ - 50.000đ)"),
  R(35,"Khu Du Lịch Tanyoli - Mông Cổ Thu Nhỏ",["Check-in","Khám phá","Vui chơi","Nghỉ dưỡng"],100000,11.6100,109.0300,"📍 Giới thiệu: Khu du lịch sinh thái mô phỏng thảo nguyên Mông Cổ độc đáo với những căn lều tròn trắng muốt giữa triền cát và núi đá Mũi Dinh. Nơi đây tích hợp nhiều hoạt động dã ngoại như bắn cung, trượt cỏ, lái xe địa hình vượt đồi cát và lưu trú qua đêm.\n💡 Mẹo hướng dẫn viên: Vé vào cổng cơ bản khoảng 100.000đ/người; nếu muốn chơi xe địa hình ATV hoặc thuê trang phục du mục sẽ tính phí riêng từ 150.000đ–600.000đ. Nhớ mang theo kem chống nắng, kính râm và mũ rộng vành vì khu vực này rất nắng gió.","100.000đ / vé vào cổng"),
  R(36,"Ngọn Hải Đăng Mũi Dinh",["Check-in","Khám phá","Ngắm bình minh","Miễn phí"],0,11.3700,109.0600,"📍 Giới thiệu: Ngọn hải đăng cổ kính đứng sừng sững trên mũi đất nhô ra biển với tầm nhìn bao quát toàn bộ đường bờ biển xanh ngắt và tiểu sa mạc cát bên dưới. Cung đường chinh phục hải đăng mang lại cảm giác phiêu lưu đầy phấn khích.\n💡 Mẹo hướng dẫn viên: Đường lên hải đăng phải băng qua đồi cát và dốc đá cao, bạn có thể thuê xe máy cày của người dân chân đồi chở qua cát (khoảng 100.000đ–150.000đ/chuyến khứ hồi) để tiết kiệm sức. Nên đi vào sáng sớm hoặc chiều muộn để tránh nắng.","Miễn phí (Xe trung chuyển qua cát ~100.000đ)"),
  R(40,"Công Viên Đá Ninh Hải",["Check-in","Khám phá","Dã ngoại"],20000,11.6800,109.1300,"📍 Giới thiệu: Quần thể đá tự nhiên hàng triệu năm tuổi nằm sát bờ biển thuộc Vườn Quốc gia Núi Chúa với hàng ngàn khối đá muôn hình vạn trạng xếp chồng lên nhau kỳ thú. Sự kết hợp giữa đá xám, thảm thực vật khô hạn và biển xanh tạo nên khung cảnh độc bản.\n💡 Mẹo hướng dẫn viên: Phí bảo tồn vào cổng khoảng 20.000đ–40.000đ/người. Địa hình có nhiều mỏm đá gồ ghề và gió biển mạnh nên bắt buộc phải mang giày thể thao có độ bám tốt, không nên mang dép trơn trượt.","20.000đ - 40.000đ / người"),
  R(41,"Đồng Cừu Suối Tiên",["Check-in","Dã ngoại","Nông trại","Gia đình"],40000,11.6300,109.0500,"📍 Giới thiệu: Khu du lịch đồng cừu được quy hoạch bài bản với dòng suối nhỏ uốn lượn, thảm cỏ xanh, những chiếc xích đu gỗ và đàn cừu thân thiện đã quen với du khách. Không gian thoáng đãng, rất phù hợp cho gia đình có trẻ nhỏ vui chơi và chụp ảnh.\n💡 Mẹo hướng dẫn viên: Vé vào cổng khoảng 40.000đ/người (đã bao gồm chụp ảnh cùng cừu và các tiểu cảnh). Bạn có thể mua thêm bó lá hoặc cỏ ngay tại quầy với giá khoảng 10.000đ để cho cừu ăn và dễ dàng thu hút chúng lại gần chụp hình.","40.000đ / người"),
  R(42,"Thiền Viện Trúc Lâm Viên Ngộ",["Tâm linh","Thư giãn","Miễn phí"],0,11.6500,108.8500,"📍 Giới thiệu: Ngôi thiền viện lớn và trang nghiêm nằm tựa lưng vào núi với kiến trúc truyền thống hài hòa cùng thiên nhiên xanh mát. Đây là nơi lý tưởng để vãn cảnh chùa, tĩnh tâm và ngắm nhìn toàn cảnh vùng đồng bằng Phan Rang từ trên cao.\n💡 Mẹo hướng dẫn viên: Nên ăn mặc lịch sự, trang nhã (tránh quần đùi, váy ngắn), giữ trật tự và đi nhẹ nói khẽ trong khuôn viên chánh điện. Thời điểm đẹp nhất để ghé thăm là buổi sáng sớm khi không khí còn trong lành và mát mẻ.","Miễn phí"),
  R(43,"Suối Lồ Ồ",["Sinh thái","Dã ngoại","Khám phá","Thư giãn"],20000,11.7000,108.9000,"📍 Giới thiệu: Dòng suối tự nhiên bắt nguồn từ núi Chúa với làn nước trong mát lạnh quanh năm, len lỏi qua những tảng đá cuội lớn dưới tán rừng rậm rạp. Nơi đây có nhiều hồ nước tự nhiên cạn, rất thích hợp để ngâm mình giải nhiệt và tổ chức picnic cuối tuần.\n💡 Mẹo hướng dẫn viên: Phí giữ xe và vệ sinh môi trường khoảng 20.000đ/người. Nên đi vào mùa nắng (tháng 2 đến tháng 8), tránh đi vào những ngày mưa lớn vì đá suối trơn trượt và nước từ thượng nguồn có thể đổ về nhanh.","20.000đ / người"),
  R(44,"Vườn Nho Thái An",["Nông trại","Dã ngoại","Ẩm thực","Gia đình","Miễn phí"],0,11.6700,109.0300,"📍 Giới thiệu: Thủ phủ trồng nho lớn nhất vùng với hàng chục nhà vườn nối tiếp nhau cho phép du khách vào tham quan miễn phí dưới những giàn nho trĩu quả. Bạn sẽ được chủ vườn mời thưởng thức nho tươi, mật nho, rượu vang nho và tự tay cắt những chùm nho ưng ý.\n💡 Mẹo hướng dẫn viên: Tham quan và chụp ảnh hoàn toàn miễn phí; nếu tự cắt nho mang về sẽ tính theo giá thị trường tại vườn (khoảng 40.000đ–80.000đ/kg tùy giống nho đỏ hay nho xanh). Hãy hỏi ý kiến chủ vườn trước khi dùng kéo cắt quả nhé.","Miễn phí vào vườn (Nho cắt tại giàn 40.000đ - 80.000đ/kg)"),
  R(45,"Mũi Thi",["Check-in","Khám phá","Dã ngoại","Miễn phí"],0,11.6900,109.1400,"📍 Giới thiệu: Mũi đất hoang sơ nhô ra biển với những vách đá dựng đứng đón những con sóng bạc đầu tung bọt trắng xóa. Từ đây du khách có thể chiêm ngưỡng vẻ đẹp hùng vĩ, nguyên sơ của vùng biển giáp ranh giữa Khánh Hòa và Ninh Thuận.\n💡 Mẹo hướng dẫn viên: Nơi đây chưa có dịch vụ du lịch nên bạn cần đi theo nhóm, mang đủ nước uống và giày leo núi bám tốt. Không đứng quá sát mép vách đá khi có sóng to hoặc gió giật mạnh.","Miễn phí"),
  R(46,"Đồi Cát Sơn Hải",["Check-in","Khám phá","Dã ngoại","Ngắm hoàng hôn","Miễn phí"],0,11.4000,109.0500,"📍 Giới thiệu: Quần thể đồi cát trắng và cát vàng trải dài sát bờ biển Mũi Dinh tạo nên sự giao thoa kỳ thú giữa sa mạc nắng cháy và đại dương xanh biếc. Đứng trên đỉnh đồi cát cao nhất có thể ngắm trọn cả vùng biển rộng lớn phía xa.\n💡 Mẹo hướng dẫn viên: Nên ghé thăm vào lúc 16h00 chiều để vừa trải nghiệm trượt cát, vừa đón hoàng hôn buông xuống trên biển. Nên mang theo túi chống cát cho điện thoại và máy ảnh vì gió biển ở đây thổi khá mạnh.","Miễn phí"),
  R(47,"Đền Tháp Chăm Po Rome",["Văn hóa Chăm","Tâm linh","Check-in"],20000,11.4500,108.9500,"📍 Giới thiệu: Ngôi tháp Chăm cổ nằm trên ngọn đồi cao thờ vua Po Rome – vị vua có công lớn trong việc phát triển thủy lợi và gắn kết cộng đồng các dân tộc. Đây là một trong những công trình kiến trúc tháp Chăm bằng gạch nung cuối cùng và mang giá trị lịch sử sâu sắc.\n💡 Mẹo hướng dẫn viên: Không gian ở đây rất tĩnh lặng và ít đông đúc hơn tháp Po Klong Garai, rất hợp cho ai thích tìm hiểu chiều sâu lịch sử. Nên đi vào buổi sáng hoặc chiều muộn và mặc trang phục kín đáo khi vào khu vực hành lễ.","20.000đ / người"),
  R(48,"Vườn Quốc Gia Núi Chúa",["Sinh thái","Khám phá","Dã ngoại"],40000,11.7200,109.1300,"📍 Giới thiệu: Khu dự trữ sinh quyển thế giới được UNESCO công nhận, nổi tiếng với hệ sinh thái rừng khô hạn độc đáo bậc nhất Việt Nam nơi rừng gặp biển. Nơi đây có nhiều cung đường trekking xuyên rừng, đỉnh Đá Đỏ và bãi rùa biển đẻ trứng tự nhiên.\n💡 Mẹo hướng dẫn viên: Vé tham quan từ 40.000đ/người; nếu đi các tuyến trekking sâu trong rừng bắt buộc phải đăng ký và thuê kiểm lâm dẫn đường để đảm bảo an toàn. Nên mang theo ít nhất 1,5–2 lít nước/người và áo khoác chống nắng.","40.000đ / người"),
  R(49,"Tháp Chapơr",["Văn hóa Chăm","Tâm linh","Khám phá","Miễn phí"],0,11.5300,108.9800,"📍 Giới thiệu: Di tích tháp Chăm cổ kính nằm ẩn mình trong vùng đồng bào Raglai và Chăm với những đường nét chạm khắc đá cổ xưa đầy bí ẩn. Điểm đến này mang đậm màu sắc khảo cổ học dành cho những du khách yêu thích khám phá lịch sử.\n💡 Mẹo hướng dẫn viên: Đường vào tháp đi qua khu dân cư địa phương nên bạn hãy kết hợp hỏi thăm người dân bản địa để tìm lối đi nhanh nhất. Nên đi vào ban ngày và giữ gìn vệ sinh chung quanh khu vực di tích.","Miễn phí"),
  R(50,"Đèo Ngoạn Mục",["Check-in","Khám phá","Miễn phí"],0,11.8800,108.5300,"📍 Giới thiệu: Một trong những cung đèo hiểm trở và hùng vĩ nhất Việt Nam nối liền vùng duyên hải nắng ấm với cao nguyên Đà Lạt se lạnh. Đứng từ đỉnh đèo có thể nhìn bao quát toàn bộ thung lũng xanh mướt và đường ống dẫn nước thủy điện Đa Nhim nổi tiếng.\n💡 Mẹo hướng dẫn viên: Đèo có nhiều khúc cua tay áo gắt và thường có sương mù vào chiều muộn, nên di chuyển vào ban ngày (8h00–15h00) và kiểm tra kỹ phanh xe trước khi đổ đèo. Chỉ dừng xe chụp ảnh tại các điểm mở rộng an toàn.","Miễn phí"),
  R(51,"Cánh Đồng Điện Gió Đầm Nại",["Check-in","Khám phá","Ngắm hoàng hôn","Miễn phí"],0,11.6100,109.0900,"📍 Giới thiệu: Những trụ tuabin gió trắng khổng lồ vươn cao giữa cánh đồng lúa xanh mướt và đầm nước mênh mông tạo nên khung cảnh đẹp như trời Âu. Sự tương phản giữa công nghệ năng lượng sạch hiện đại và làng quê yên bình tạo nên sức hút đặc biệt.\n💡 Mẹo hướng dẫn viên: Khung giờ chụp ảnh đẹp nhất là 16h30–17h45 khi ánh nắng hoàng hôn nhuộm vàng cả cánh đồng và bầu trời chuyển sắc tím hồng. Bạn có thể đứng dọc theo các con đường bê tông nội đồng để lấy trọn góc rộng của các trụ điện gió.","Miễn phí"),
  R(52,"Bãi Kinh",["Tắm biển","Check-in","Dã ngoại"],20000,11.6700,109.1500,"📍 Giới thiệu: Bãi biển nhỏ xinh nằm nép mình dưới chân đèo trên cung đường ven biển Vĩnh Hy – Bình Tiên, nổi tiếng với làn nước xanh ngọc bích trong vắt và bãi cát trắng mịn. Đây cũng là bến tàu chính để du khách đi cano sang đảo Bình Hưng.\n💡 Mẹo hướng dẫn viên: Phí vào bãi và tắm nước ngọt khoảng 20.000đ–30.000đ/người. Sóng ở đây rất êm và độ dốc thoải nên tắm biển cực kỳ an toàn; bạn có thể kết hợp đi tàu đáy kính ngắm san hô ngay tại bãi.","20.000đ - 30.000đ / người"),
  R(53,"Bãi Nước Ngọt",["Tắm biển","Dã ngoại","Thư giãn"],20000,11.7050,109.1750,"📍 Giới thiệu: Bãi biển độc đáo được bao bọc bởi những vách núi đá hùng vĩ với một dòng suối nước ngọt tự nhiên từ trên núi chảy thẳng ra sát bờ biển. Du khách có thể vừa tắm biển mặn vừa ngâm mình trong làn nước suối ngọt mát lạnh ngay bên cạnh.\n💡 Mẹo hướng dẫn viên: Vé vào khu vực bãi khoảng 20.000đ/người, có dịch vụ cho thuê lều cắm trại qua đêm và bếp nướng BBQ. Nên mang theo đầy đủ đồ dùng cá nhân và thuốc chống côn trùng nếu có ý định cắm trại qua đêm.","20.000đ / người"),
  R(54,"Rạn San Hô Cổ Hòn Đỏ",["Khám phá","Tắm biển","Sinh thái","Check-in","Miễn phí"],0,11.6900,109.2000,"📍 Giới thiệu: Quần thể rạn san hô hóa thạch hàng ngàn năm tuổi nhô lên khỏi mặt nước với hình thù kỳ lạ như những khu rừng đá thu nhỏ giữa biển. Khi thủy triều rút, các hồ nước tự nhiên lộ ra với vô số cá nhỏ, sao biển và rong biển xanh mướt.\n💡 Mẹo hướng dẫn viên: Nên tìm hiểu lịch thủy triều để đến vào lúc nước rút (thường vào buổi sáng sớm hoặc chiều muộn) mới thấy rõ rạn san hô cổ. Đá san hô rất sắc nhọn nên hãy mang giày đi biển và tuyệt đối không bẻ san hô mang về.","Miễn phí"),
  R(55,"Vườn Trái Cây Lâm Sơn",["Nông trại","Sinh thái","Ẩm thực","Gia đình"],50000,11.7700,108.8600,"📍 Giới thiệu: Vùng chuyên canh cây ăn trái trù phú nằm dưới chân đèo Ngoạn Mục với khí hậu mát mẻ quanh năm, nổi tiếng với sầu riêng, chôm chôm, măng cụt, bưởi da xanh và mít tố nữ. Du khách được dạo bước dưới bóng cây mát rượi và thưởng thức trái cây tươi hái tại vườn.\n💡 Mẹo hướng dẫn viên: Mùa trái cây rộ nhất là từ tháng 5 đến tháng 8 hàng năm. Giá vé vào vườn tham quan ăn trái cây tại chỗ dao động từ 50.000đ–100.000đ/người tùy vườn; nếu muốn hái mang về sẽ cân ký tính tiền theo giá nhà vườn.","50.000đ - 100.000đ / người"),
  R(56,"Vườn Quốc Gia Phước Bình",["Sinh thái","Khám phá","Dã ngoại"],40000,11.9500,108.7000,"📍 Giới thiệu: Khu rừng nguyên sinh vùng núi cao giáp ranh Lâm Đồng với khí hậu mát mẻ quanh năm, hệ thống thác nước hùng vĩ và là nơi bảo tồn loài bò tót quý hiếm. Nơi đây còn lưu giữ nét văn hóa bản địa đặc sắc của đồng bào Raglai với đàn đá và rượu cần.\n💡 Mẹo hướng dẫn viên: Vé tham quan khoảng 40.000đ/người. Đường đi có nhiều đoạn đèo dốc vùng núi cao nên hãy kiểm tra kỹ phương tiện và nên đi theo đoàn, liên hệ trước với ban quản lý vườn nếu muốn cắm trại hoặc trekking.","40.000đ / người"),

const byId = id => DESTINATIONS.find(d => d.id === id);
const money = n => n === 0 ? T("free") : n.toLocaleString("vi-VN") + "đ";
const priceLabel = d => d.priceText || priceLabel(d);

const tagLabel = t => lang === "en" ? TAG_EN[t] : t;
const mapsLink = d => "https://www.google.com/maps/dir/?api=1&destination=" + d.lat + "," + d.lng;

function icons() {
  document.querySelectorAll("i[data-lucide]").forEach(e => {
    const n = e.dataset.lucide, c = e.className;
    const sz = /w-7/.test(c) ? "text-2xl" : /w-5/.test(c) ? "text-xl" : /w-4/.test(c) ? "text-sm" : "text-lg";
    e.className = "fa-solid " + (FA[n] || "fa-circle") + " " + sz + " " + c;
    e.removeAttribute("data-lucide");
  });
}

try {
  const s = JSON.parse(localStorage.getItem("itin_saved") || "null");
  if (s) { itin = s.ids; people = s.people; days = s.days; }
} catch (e) {}

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("langBtn").textContent = lang.toUpperCase();
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = T(e.dataset.ph));
  document.getElementById("quick").innerHTML = ["q1","q2","q3"].map(k => '<button class="chip whitespace-nowrap" data-q="' + k + '">' + T(k) + '</button>').join("");
  document.querySelectorAll("#quick .chip").forEach(b => b.onclick = () => sendMessage(T(b.dataset.q)));
  renderTags(); renderGrid(); renderItin(); renderWeather();
  icons();
}

function renderTags() {
  const list = [["", T("all")]].concat(TAGS.map(t => [t, tagLabel(t)]));
  document.getElementById("tags").innerHTML = list.map(([v, l]) => '<button class="tag ' + (tagFilter === v ? "on" : "") + '" data-v="' + v + '">#' + l + '</button>').join("");
  document.querySelectorAll("#tags .tag").forEach(b => b.onclick = () => { tagFilter = b.dataset.v; renderTags(); renderGrid(); });
}

function renderGrid() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = DESTINATIONS.filter(d => (!tagFilter || d.tags.includes(tagFilter)) && (!q || (d.name + " " + d.desc + " " + d.area + " " + d.tags.join(" ")).toLowerCase().includes(q) || d.tags.some(t => TAG_EN[t].toLowerCase().includes(q))));
  document.getElementById("grid").innerHTML = list.map(d =>
    '<button class="card overflow-hidden text-left hover:-translate-y-1 transition" onclick="openDetail(' + d.id + ')">' +
    '<img class="thumb w-full aspect-[4/3]" loading="lazy" src="' + img(d) + '" alt="' + esc(d.name) + '" onerror="this.style.opacity=0.15">' +
    '<div class="p-3"><div class="font-semibold text-sm sm:text-base leading-snug">' + esc(d.name) + '</div>' +
    '<div class="text-xs text-[#1B5E63] mt-1">' + (checked.includes(d.id) ? "✅ " : "") + d.tags.map(t => "#" + tagLabel(t)).join(" ") + '</div></div></button>'
  ).join("");
  document.getElementById("none").classList.toggle("hidden", list.length > 0);
}

function openModal(html) {
  const m = document.getElementById("modal");
  document.getElementById("modalBody").innerHTML = '<button class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-white/90 shadow flex items-center justify-center" onclick="closeModal()" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>' + html;
  m.classList.remove("hidden"); m.classList.add("flex");
  icons();
}
function closeModal() {
  const m = document.getElementById("modal");
  m.classList.add("hidden"); m.classList.remove("flex");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function openDetail(id) {
  const d = byId(id);
  const inIt = itin.includes(id), ck = checked.includes(id);
  openModal(
    '<img class="thumb w-full aspect-video rounded-t-3xl" src="' + img(d) + '" alt="' + esc(d.name) + '" onerror="this.style.opacity=0.15">' +
    '<div class="p-5"><h3 class="text-2xl font-bold">' + esc(d.name) + '</h3>' +
    '<div class="flex flex-wrap gap-2 my-2">' + d.tags.map(t => '<button class="tag !py-1" onclick="filterTag(\'' + t + '\')">#' + tagLabel(t) + '</button>').join("") + '</div>' +
    '<p class="text-sm leading-relaxed my-3 whitespace-pre-line">' + esc(d.desc) + '</p>' +
    '<p class="text-sm mb-4"><b>' + (lang === "en" ? "Suggested price" : "Giá gợi ý") + ':</b> ' + priceLabel(d) + '</p>' +
    '<div class="flex flex-col gap-2">' +
    '<button class="btn justify-center" onclick="toggleItin(' + id + ');openDetail(' + id + ')"><i data-lucide="' + (inIt ? "minus" : "plus") + '" class="w-4 h-4"></i>' + (inIt ? T("remove") : T("add")) + '</button>' +
    '<button class="btn alt justify-center" onclick="askAbout(' + id + ')"><i data-lucide="sparkles" class="w-4 h-4"></i>' + T("ask") + '</button>' +
    '<button class="btn alt justify-center" onclick="checkIn(' + id + ')"><i data-lucide="' + (ck ? "check-circle" : "flag") + '" class="w-4 h-4"></i>' + (ck ? T("done") : T("chk")) + '</button>' +
    (d.lat ? '<a class="btn alt justify-center" target="_blank" rel="noopener" href="' + mapsLink(d) + '"><i data-lucide="navigation" class="w-4 h-4"></i>' + T("dir") + '</a>' : "") +
    '</div></div>'
  );
}

function filterTag(t) {
  closeModal();
  tagFilter = t;
  document.getElementById("q").value = "";
  renderTags(); renderGrid();
  document.getElementById("explore").scrollIntoView({behavior: "smooth"});
}
function toggleItin(id) {
  itin = itin.includes(id) ? itin.filter(x => x !== id) : itin.concat(id);
  renderItin();
}
function askAbout(id) {
  closeModal(); goAI();
  sendMessage((lang === "en" ? "Tell me about " : "Hãy giới thiệu và tư vấn về ") + byId(id).name);
}
function checkIn(id) {
  if (!checked.includes(id)) {
    checked.push(id);
    localStorage.setItem("checked", JSON.stringify(checked));
    renderGrid();
  }
  openDetail(id);
}

function estimate() {
  const sum = itin.reduce((s, id) => s + byId(id).price, 0);
  return (sum + 400000 * days) * people;
}

function renderItin() {
  const box = document.getElementById("itin");
  if (!itin.length) { box.innerHTML = '<p class="text-sm text-[#17353a]/70">' + T("empty") + '</p>'; return; }
  const shown = itin.slice(0, 4);
  box.innerHTML =
    '<div class="flex gap-2 mb-3">' + shown.map(id => '<img class="thumb w-16 h-16 rounded-xl" src="' + img(byId(id)) + '" alt="' + esc(byId(id).name) + '" onerror="this.style.opacity=0.15">').join("") +
    (itin.length > 4 ? '<div class="w-16 h-16 rounded-xl bg-[#e4efee] flex items-center justify-center font-semibold text-[#1B5E63]">+' + (itin.length - 4) + '</div>' : "") + '</div>' +
    '<ul class="text-sm mb-3 list-disc pl-5">' + itin.map(id => '<li>' + esc(byId(id).name) + '</li>').join("") + '</ul>' +
    '<div class="grid grid-cols-2 gap-2 text-sm mb-3">' +
    stepper(T("ppl"), "people", people) + stepper(T("days"), "days", days) + '</div>' +
    '<div class="flex justify-between items-center mb-3"><span class="text-sm">' + T("total") + '</span><b class="text-lg text-[#1B5E63]">' + estimate().toLocaleString("vi-VN") + 'đ</b></div>' +
    '<button class="btn w-full justify-center" onclick="saveItin()"><i data-lucide="download" class="w-4 h-4"></i>' + T("save") + '</button>';
  icons();
}
function stepper(label, key, val) {
  return '<div class="bg-[#e4efee] rounded-2xl p-2 flex items-center justify-between"><span>' + label + '</span><span class="flex items-center gap-2">' +
    '<button class="w-6 h-6 rounded-full bg-white" onclick="step(\'' + key + '\',-1)">−</button><b>' + val + '</b>' +
    '<button class="w-6 h-6 rounded-full bg-white" onclick="step(\'' + key + '\',1)">+</button></span></div>';
}
function step(k, dlt) {
  if (k === "people") people = Math.max(1, Math.min(20, people + dlt));
  else days = Math.max(1, Math.min(14, days + dlt));
  renderItin();
}
function saveItin() {
  localStorage.setItem("itin_saved", JSON.stringify({ids: itin, people: people, days: days}));
  alert(T("saved"));
}
function openOffline() {

let qStep = 0, qAns = [];
function openQuiz() { qStep = 0; qAns = []; renderQuiz(); }
function renderQuiz() {
  const Q = T("quiz");
  if (qStep < Q.length) {
    openModal('<div class="p-5"><h3 class="text-xl font-bold mb-1 pr-10">🐑 ' + T("qT") + '</h3><p class="text-xs mb-4">' + (qStep + 1) + '/' + Q.length + '</p>' +
      '<p class="font-semibold mb-3">' + Q[qStep][0] + '</p><div class="grid gap-2">' +
      Q[qStep][1].map((o, i) => '<button class="btn alt justify-center" onclick="answerQuiz(' + i + ')">' + o + '</button>').join("") + '</div></div>');
    return;
  }
  const picks = quizPicks();
  openModal('<div class="p-5"><h3 class="text-xl font-bold mb-3 pr-10">🐑 ' + T("qResult") + '</h3><div class="grid grid-cols-2 gap-3">' +
    picks.map(d => '<button class="text-left rounded-2xl overflow-hidden bg-[#f1efe8]" onclick="openDetail(' + d.id + ')"><img class="thumb w-full aspect-[4/3]" src="' + img(d) + '" alt="" onerror="this.style.opacity=0.15"><div class="p-2 text-sm font-semibold">' + esc(d.name) + '</div></button>').join("") +
    '</div><button class="btn mt-4" onclick="openQuiz()">' + T("qAgain") + '</button></div>');
}
function answerQuiz(i) { qAns.push(i); qStep++; renderQuiz(); }
function quizPicks() {
  const likeTag = ["Tắm biển","Dã ngoại","Văn hóa","Check-in"][qAns[0]];
  const companion = [["Tắm biển","Văn hóa"],["Dã ngoại","Check-in"],["Check-in","Tắm biển"],["Văn hóa","Dã ngoại"]][qAns[1]];
  const wantFood = qAns[2] !== 3;
  const maxP = [100000, 300000, Infinity][qAns[3]];
  return DESTINATIONS.filter(d => !d.placeholder).map(d => {
    let s = 0;
    if (d.tags.includes(likeTag)) s += 3;
    companion.forEach(t => { if (d.tags.includes(t)) s += 1; });
    if (wantFood && d.tags.includes("Ẩm thực")) s += 2;
    if (d.price <= maxP) s += 2; else s -= 3;
    return {d: d, s: s};
  }).sort((a, b) => b.s - a.s).slice(0, 6).map(x => x.d);
}

const WMO = c => c === 0 ? "☀️" : c <= 3 ? "⛅" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 82 ? "🌦️" : "⛈️";
const COORDS = {KH: [12.2388, 109.1967, "Khánh Hòa"], NT: [11.5752, 108.9890, "Ninh Thuận"]};
async function loadWeather(p) {
  province = p;
  const c = COORDS[p];
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + c[0] + "&longitude=" + c[1] + "&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&timezone=Asia%2FBangkok&forecast_days=2";
  try {
    const r = await fetch(url);
    const j = await r.json();
    const idx = Math.max(0, j.hourly.time.findIndex(t => t >= j.current.time.slice(0, 13) + ":00"));
    weatherInfo = {p: p, temp: Math.round(j.current.temperature_2m), code: j.current.weather_code,
      slots: [0, 3, 6, 9].map(o => ({t: Math.round(j.hourly.temperature_2m[idx + o]), c: j.hourly.weather_code[idx + o]}))};
    localStorage.setItem("weather_" + p, JSON.stringify(weatherInfo));
  } catch (e) {
    const cached = localStorage.getItem("weather_" + p);
    weatherInfo = cached ? JSON.parse(cached) : null;
  }
  renderWeather();
}
function renderWeather() {
  document.getElementById("wKH").className = "px-3 py-1 rounded-full " + (province === "KH" ? "bg-white text-[#1B5E63] font-semibold" : "");
  document.getElementById("wNT").className = "px-3 py-1 rounded-full " + (province === "NT" ? "bg-white text-[#1B5E63] font-semibold" : "");
  const now = document.getElementById("wNow"), hrs = document.getElementById("wHours");
  if (!weatherInfo) { now.innerHTML = '<span class="text-sm">' + T("wErr") + '</span>'; hrs.innerHTML = ""; return; }
  now.innerHTML = '<span class="text-6xl">' + WMO(weatherInfo.code) + '</span><span>' + weatherInfo.temp + '°C</span>';
  hrs.innerHTML = weatherInfo.slots.map((s, i) => '<div class="bg-white/15 rounded-2xl py-2"><div class="text-xs opacity-80">' + T("hours")[i] + '</div><div class="text-xl my-1">' + WMO(s.c) + '</div><div>' + s.t + '°</div></div>').join("");
}

   [11.43,114.33,"Đảo Song Tử Tây"],[10.18,114.37,"Đảo Nam Yết"],[9.88,114.33,"Đảo Sinh Tồn"],[8.65,111.92,"Đảo Trường Sa Lớn"]]
    .forEach(p => L.circleMarker([p[0], p[1]], {radius: 4, color: "#c0392b", fillOpacity: 1}).addTo(map).bindTooltip(p[2]));

      '<a href="' + mapsLink(d) + '" target="_blank" rel="noopener" style="color:#1B5E63;font-weight:600">' + T("dir") + '</a></div>');

function addMsg(text, who) {
  const chat = document.getElementById("chat");
  const wrap = document.createElement("div");
  wrap.className = "flex flex-col gap-1 " + (who === "me" ? "items-end" : "items-start");
  const b = document.createElement("div");
  b.className = "bubble " + who;
  b.textContent = text;
  wrap.appendChild(b);
  if (who === "bot") {
    const sp = document.createElement("button");
    sp.className = "chip !px-2 !py-1 flex items-center gap-1";
    sp.innerHTML = '<i data-lucide="volume-2" class="w-4 h-4"></i>';
    sp.setAttribute("aria-label", "Speak");
    sp.onclick = () => speak(text);
    wrap.appendChild(sp);
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  icons();
  return b;
}
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "en" ? "en-US" : "vi-VN";
  speechSynthesis.speak(u);
}

async function sendMessage(text) {
  text = (text || "").trim();
  if (!text) return;
  addMsg(text, "me");
  document.getElementById("msg").value = "";
  const wait = addMsg(T("thinking"), "bot");
  let ans;
  if (GEMINI_API_KEY) {
    try { ans = await callGeminiAPIStream(text, wait); } catch (e) { ans = "Lỗi: " + e.message ; }
  }
  if (!ans) ans = localAI(text);
  wait.textContent = ans;
  const old = wait.parentElement.querySelector("button");
  if (old) old.onclick = () => speak(ans);
  document.getElementById("chat").scrollTop = 1e6;
}

async function callGeminiAPIStream(q, waitElement) {
  const sys = "Bạn là AI Tour Guide chuyên nghiệp của vùng Khánh Hòa – Ninh Thuận. Hãy tư vấn nhiệt tình, lên lịch trình chi tiết theo từng buổi (Sáng, Trưa, Chiều, Tối) kèm gợi ý quán ăn đặc sản và chi phí tham khảo bằng " + (lang === "en" ? "English." : "tiếng Việt.");
  const keys = [
    typeof GEMINI_API_KEY !== "undefined" ? GEMINI_API_KEY : "",
    typeof GEMINI_API_KEY_2 !== "undefined" ? GEMINI_API_KEY_2 : "",
    typeof GEMINI_API_KEY_3 !== "undefined" ? GEMINI_API_KEY_3 : ""
  ].filter(k => k && k.trim());

  const chatBox = document.getElementById("chat");

  for (let i = 0; i < keys.length; i++) {
    const url = "https://generativelanguage." + "googleapis.com" + "/v1beta" + "/models/" + GEMINI_MODEL + ":streamGenerateContent?alt=sse&key=" + keys[i].trim();
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sys }] },
        contents: [{ role: "user", parts: [{ text: q }] }]
      })
    });

    if (!r.ok) continue;

    const reader = r.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let fullText = "";
    let isFirst = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split("\n");

      for (const line of lines) {
        if (line.startsWith("data: ")) {
          try {
            const json = JSON.parse(line.slice(6));
            const part = json.candidates[0].content.parts[0].text;
            if (part) {
              if (isFirst) {
                waitElement.textContent = "";
                isFirst = false;
              }
              fullText += part.replace(/\*\*/g, "");
              waitElement.textContent = fullText;
              chatBox.scrollTop = 1e6;
            }
          } catch (err) {}
        }
      }
    }

    if (fullText) return fullText;
  }

  return "Lỗi từ Google API: Không thể kết nối";
}
function localAI(q) {
  const s = q.toLowerCase(), en = lang === "en";
  const pool = DESTINATIONS.filter(d => !d.placeholder);
  const nums = s.match(/(\d+)\s*(n|ngày|day|người|nguoi|people|person)/g) || [];
  let dd = days, pp = people;
  nums.forEach(x => { const n = parseInt(x); if (/người|nguoi|people|person/.test(x)) pp = n; else dd = n; });
  if (/lịch trình|lich trinh|itinerary|plan|3n2đ/.test(s)) {
    const pref = pool.filter(d => d.id <= 8 || d.id === 17 || d.id === 18);
    const picks = (/nha trang/.test(s) ? pref : pool).slice(0, Math.max(dd * 2, 2));
    let out = (en ? "Suggested plan for " : "Gợi ý lịch trình ") + dd + (en ? " days:\n" : " ngày:\n");
    for (let i = 0; i < dd; i++) {
      const part = picks.slice(i * 2, i * 2 + 2).map(d => d.name);
      out += (en ? "Day " : "Ngày ") + (i + 1) + ": " + (part.join(" → ") || (en ? "free time" : "tự do nghỉ ngơi")) + "\n";
    }
    return out + (en ? "Tap a place below to add it to your plan." : "Bấm vào địa điểm bên dưới để thêm vào lịch trình.");
  }
  if (/chi phí|chi phi|tiền|giá|cost|budget|price/.test(s)) {
    const ids = itin.length ? itin : pool.slice(0, 4).map(d => d.id);
    const sum = ids.reduce((a, id) => a + byId(id).price, 0);
    const tot = (sum + 400000 * dd) * pp;
    return (en ? "Estimate for " : "Dự tính cho ") + pp + (en ? " people, " : " người, ") + dd + (en ? " days:\n" : " ngày:\n") +
      (en ? "Tickets & activities: " : "Vé và trải nghiệm: ") + (sum * pp).toLocaleString("vi-VN") + "đ\n" +
      (en ? "Food, stay & transport (about 400,000đ per person per day): " : "Ăn, ở, đi lại (khoảng 400.000đ/người/ngày): ") + (400000 * dd * pp).toLocaleString("vi-VN") + "đ\n" +
      (en ? "Total: " : "Tổng: ") + tot.toLocaleString("vi-VN") + "đ";
  }
  if (/thời tiết|thoi tiet|weather|ăn uống|an uong|food|lưu ý|tip/.test(s)) {
    const w = weatherInfo ? (en ? "Now in " : "Hiện tại ở ") + COORDS[weatherInfo.p][2] + ": " + weatherInfo.temp + "°C. " : "";
    return w + (en ? "Bring sunscreen, a hat and water; sun and wind are strong, especially in Ninh Thuan. Try grilled spring rolls, fish noodle soup and fresh seafood, and check prices before ordering." : "Mang kem chống nắng, mũ và nước uống vì nắng gió mạnh, nhất là ở Ninh Thuận. Nên thử nem nướng, bánh canh chả cá, hải sản tươi và hỏi giá trước khi gọi món. Biển có thể động vào mùa gió, hãy theo dõi cảnh báo trước khi ra đảo.");
  }
  const kw = s.replace(/hãy|giới thiệu|và|tư vấn|về|tell me about/g, "").trim();
  const hit = pool.filter(d => kw && (d.name.toLowerCase().includes(kw) || (d.name + d.desc + d.tags.join(" ")).toLowerCase().includes(kw) || s.includes(d.name.toLowerCase())));
  if (hit.length) return hit.slice(0, 3).map(d => d.name + ": " + d.desc + " " + (en ? "Price: " : "Giá gợi ý: ") + priceLabel(d)).join("\n\n");
  return en ? "I can plan trips, estimate costs and share weather and food tips. Try a quick question below." : "Mình có thể lên lịch trình, tính chi phí, tư vấn thời tiết và ăn uống. Bạn thử bấm một câu hỏi gợi ý bên dưới nhé.";
}

applyLang();

addMsg(T("hello"), "bot");
loadWeather("KH");
